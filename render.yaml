services:
  - type: web
    name: ams-backend
    env: python
    buildCommand: "pip install -r requirements.txt && cd amsapp && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py seed_menus"
    startCommand: "cd amsapp && gunicorn --bind 0.0.0.0:${PORT:-8000} amsapp.wsgi:application"
    rootDir: "."
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: "postgresql://root:p1zFJz7SAfXQN10s6MT511iDL3MuSLOm@dpg-dbtj1lm1egvs73b37ib0-a/ams_db_gneg"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: "True"
      - key: PYTHON_VERSION
        value: "3.12.6"
