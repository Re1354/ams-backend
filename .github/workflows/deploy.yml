name: Deploy Django Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3

        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          debug: true

          script: |
            if [ -d "$HOME/ams-diu-backend" ]; then
              cd "$HOME/ams-diu-backend"
            elif [ -d "/home/ubuntu/ams-diu-backend" ]; then
              cd /home/ubuntu/ams-diu-backend
            else
              cd "$(find /home -maxdepth 2 -name ams-diu-backend -type d 2>/dev/null | head -n 1)"
            fi

            echo ">> Deploying in directory: $(pwd)"
            git fetch origin main
            git checkout main
            git pull origin main

            echo ">> Deploying with Docker Compose..."
            if [ -f "./deploy.sh" ]; then
              chmod +x ./deploy.sh
              ./deploy.sh
            else
              docker network inspect web >/dev/null 2>&1 || docker network create web
              docker compose --env-file .env up -d --build
            fi

            echo ">> Deployment completed successfully."
