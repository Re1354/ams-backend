  /api/schedules/create/:
    post:
      operationId: schedules_create_create
      description: "Create a new exam schedule with exam ID and start time.\n    \n\
        \    The end time is automatically calculated based on the exam's duration.\n\
        \    \n    Example Usage:\n    - Provide exam_id and start_time\n    - System\
        \ automatically calculates end_time using exam duration\n    - If exam duration\
        \ is 120 minutes and start_time is 15:00, end_time will be 17:00\n    - Times\
        \ should be in ISO 8601 format (YYYY-MM-DDTHH:MM:SSZ)\n    "
      summary: Create exam schedule
      tags:
      - Schedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExamScheduleRequest'
            examples:
              Auto-CalculateEndTime:
                value:
                  exam_id: 16
                  start_time: '2025-09-26T15:00:00Z'
                  is_active: true
                summary: Example request with auto-calculated end time
                description: Provide only exam_id and start_time. End time is calculated
                  automatically based on exam duration.
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateExamScheduleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateExamScheduleRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  schedule:
                    $ref: '#/components/schemas/ExamSchedule'
                  exam_details:
                    type: object
                    properties:
                      exam_id:
                        type: integer
                      department:
                        type: string
                      semester:
                        type: string
                      total_questions:
                        type: integer
                      present_question:
                        type: integer
                      duration_minutes:
                        type: integer
                example:
                  message: 'Exam schedule created successfully (Duration: 120 minutes)'
                  schedule:
                    id: 1
                    exam: 16
                    start_time: '2025-09-26T15:00:00Z'
                    end_time: '2025-09-26T17:00:00Z'
                    is_active: true
                    created_at: '2025-09-26T14:30:00Z'
                  exam_details:
                    exam_id: 16
                    department: Computer Science
                    semester: Fall 2025
                    total_questions: 10
                    present_question: 10
                    duration_minutes: 120
                  calculated_times:
                    start_time: '2025-09-26T15:00:00+00:00'
                    end_time: '2025-09-26T17:00:00+00:00'
                    duration_minutes: 120
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Bad request - validation errors
                content:
                  application/json:
                    examples:
                      missing_exam_id:
                        summary: Missing exam_id
                        value:
                          error: exam_id is required
                      missing_times:
                        summary: Missing time fields
                        value:
                          error: start_time is required
                      invalid_time_format:
                        summary: Invalid time format
                        value:
                          start_time:
                          - 'Datetime has wrong format. Use one of these formats instead:
                            YYYY-MM-DD[T]HH:MM[:ss[.uuuuuu]][+HH:MM|-HH:MM|Z].'
                      end_before_start:
                        summary: End time before start time
                        value:
                          non_field_errors:
                          - End time must be after start time
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Exam not found
                content:
                  application/json:
                    example:
                      error: Exam with ID 999 not found
          description: ''
