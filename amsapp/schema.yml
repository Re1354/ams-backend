openapi: 3.0.3
info:
  title: AMS DIU Backend API
  version: 1.0.0
  description: API for Academic Management System - DIU Backend with scrapped questions
    and educational content
paths:
  /api/all-exams/:
    get:
      operationId: all_exams_list
      description: 'Retrieve exams with role-based filtering: superadmin sees all
        exams, other users only see exams that contain questions matching their department_shortname.'
      summary: Get all exams
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Exam
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExamList'
          description: ''
  /api/all-scrapped-questions/:
    get:
      operationId: all_scrapped_questions_list
      description: Retrieve all scrapped questions with optional filtering, sorting,
        and pagination. Returns questions with pagination metadata.
      summary: Get all scrapped questions
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number (default 1)
      - in: query
        name: per_page
        schema:
          type: integer
        description: Items per page (default 10, max 100)
      - in: query
        name: search
        schema:
          type: string
        description: Search in question text and subject
      - in: query
        name: semester
        schema:
          type: string
        description: Filter questions by semester
      - in: query
        name: sort_by
        schema:
          type: string
          enum:
          - -id
          - -marks
          - -semester
          - -subject
          - -type
          - id
          - marks
          - semester
          - subject
          - type
        description: Sort questions by field
      - in: query
        name: subject
        schema:
          type: string
        description: Filter questions by subject
      - in: query
        name: type
        schema:
          type: string
          enum:
          - option
          - text
        description: Filter questions by type
      tags:
      - Questions
      security:
      - BearerAuth: []
      - cookieAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScrappedQuestionList'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate user and return simple token with user details
      summary: User Login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username for login
                  example: admin
                password:
                  type: string
                  description: Password for login
                  example: admin123
              required:
              - username
              - password
            examples:
              LoginRequest:
                value:
                  username: admin
                  password: admin123
                summary: Example login request
                description: Login with username and password
      security:
      - BearerAuth: []
      - cookieAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Login successful
                content:
                  application/json:
                    example:
                      success: true
                      message: Login successful
                      data:
                        token: abc123def456ghi789...
                        user:
                          id: 1
                          username: admin
                          email: admin@example.com
                          created_at: '2024-01-01T10:00:00Z'
                          role_details:
                            id: 1
                            role_name: superadmin
                          department_details:
                            id: 1
                            department_name: Computer Science
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid credentials or validation error
                content:
                  application/json:
                    example:
                      success: false
                      message: Invalid credentials
                      errors:
                      - Invalid credentials
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Refresh access token using refresh token
      summary: Refresh Token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
                  description: Refresh token
                  example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
              required:
              - refresh
            examples:
              RefreshTokenRequest:
                value:
                  refresh: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                summary: Example refresh token request
                description: Refresh access token using refresh token
      security:
      - BearerAuth: []
      - cookieAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Token refreshed successfully
                content:
                  application/json:
                    example:
                      access: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid refresh token
                content:
                  application/json:
                    example:
                      detail: Token is blacklisted
                      code: token_not_valid
          description: ''
  /api/auth/verify/:
    post:
      operationId: auth_verify_create
      description: Verify token and return user details
      summary: Verify Token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Authentication token
                  example: abc123def456ghi789...
              required:
              - token
            examples:
              VerifyTokenRequest:
                value:
                  token: abc123def456ghi789...
                summary: Example token verification request
                description: Verify authentication token
      security:
      - BearerAuth: []
      - cookieAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Token is valid
                content:
                  application/json:
                    example:
                      success: true
                      message: Token is valid
                      data:
                        user:
                          id: 1
                          username: admin
                          email: admin@example.com
                          created_at: '2024-01-01T10:00:00Z'
                          role_details:
                            id: 1
                            role_name: superadmin
                          department_details:
                            id: 1
                            department_name: Computer Science
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid token
                content:
                  application/json:
                    example:
                      success: false
                      message: Invalid token
                      errors:
                      - Token is invalid or expired
          description: ''
  /api/create-exam/:
    post:
      operationId: create_exam_create
      description: Create an exam by selecting questions from different subjects based
        on percentage distribution.
      summary: Create exam with questions
      tags:
      - Exam
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExamCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamCreateRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  exam_id:
                    type: integer
                    description: Created exam ID
                  total_questions:
                    type: integer
                    description: Total questions in exam
                  total_marks:
                    type: integer
                    description: Total marks for exam
                  message:
                    type: string
                    description: Success message
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Bad request - validation errors
          description: ''
  /api/departments/:
    get:
      operationId: get_all_departments
      description: Retrieve all departments in the system with their names and shortnames.
      summary: Get all departments
      tags:
      - Departments
      security:
      - BearerAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Departments retrieved successfully
                content:
                  application/json:
                    example:
                      success: true
                      data:
                      - id: 1
                        department_name: Computer Science and Engineering
                        department_shortname: CSE
                      - id: 2
                        department_name: Electrical and Electronic Engineering
                        department_shortname: EEE
                      message: Departments retrieved successfully
          description: ''
  /api/departments/{department_id}/:
    get:
      operationId: get_department_by_id
      description: Retrieve a specific department by its ID with name and shortname.
      summary: Get department by ID
      parameters:
      - in: path
        name: department_id
        schema:
          type: integer
        required: true
      tags:
      - Departments
      security:
      - BearerAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Department retrieved successfully
                content:
                  application/json:
                    example:
                      success: true
                      data:
                        id: 1
                        department_name: Computer Science and Engineering
                        department_shortname: CSE
                      message: Department retrieved successfully
          description: ''
        '404':
          description: Department not found
  /api/departments/{department_id}/delete/:
    delete:
      operationId: delete_department
      description: 'Delete a department. Only superadmin can perform this action.
        Warning: This will affect all users assigned to this department.'
      summary: Delete department
      parameters:
      - in: path
        name: department_id
        schema:
          type: integer
        required: true
      tags:
      - Departments
      security:
      - BearerAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Department deleted successfully
        '403':
          description: Only superadmin can delete departments
        '404':
          description: Department not found
  /api/departments/{department_id}/update/:
    put:
      operationId: update_department_full
      description: Update department name and shortname. Only superadmin can perform
        this action. Requires all fields.
      summary: Update department (PUT)
      parameters:
      - in: path
        name: department_id
        schema:
          type: integer
        required: true
      tags:
      - Departments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                department_name:
                  type: string
                  description: Full name of the department
                  example: Computer Science and Engineering
                department_shortname:
                  type: string
                  description: Short name/abbreviation of the department
                  example: CSE
              required:
              - department_name
              - department_shortname
      security:
      - BearerAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Department updated successfully
                content:
                  application/json:
                    example:
                      success: true
                      data:
                        id: 1
                        department_name: Computer Science and Engineering
                        department_shortname: CSE
                      message: Department "Computer Science and Engineering" updated
                        successfully
          description: ''
        '400':
          description: Invalid data
        '403':
          description: Only superadmin can update departments
        '404':
          description: Department not found
    patch:
      operationId: update_department_partial
      description: Partially update department name and/or shortname. Only superadmin
        can perform this action. Only provided fields will be updated.
      summary: Update department (PATCH)
      parameters:
      - in: path
        name: department_id
        schema:
          type: integer
        required: true
      tags:
      - Departments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                department_name:
                  type: string
                  description: Full name of the department
                  example: Computer Science and Engineering
                department_shortname:
                  type: string
                  description: Short name/abbreviation of the department
                  example: CSE
      security:
      - BearerAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Department updated successfully
                content:
                  application/json:
                    example:
                      success: true
                      data:
                        id: 1
                        department_name: Computer Science and Engineering
                        department_shortname: CSE
                      message: Department "Computer Science and Engineering" updated
                        successfully
          description: ''
        '400':
          description: Invalid data
        '403':
          description: Only superadmin can update departments
        '404':
          description: Department not found
  /api/departments/create/:
    post:
      operationId: create_department
      description: Create a new department with name and shortname. Only superadmin
        can perform this action.
      summary: Create a new department
      tags:
      - Departments
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                department_name:
                  type: string
                  description: Full name of the department
                  example: Computer Science and Engineering
                department_shortname:
                  type: string
                  description: Short name/abbreviation of the department
                  example: CSE
              required:
              - department_name
              - department_shortname
      security:
      - BearerAuth: []
      - cookieAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                description: Department created successfully
                content:
                  application/json:
                    example:
                      success: true
                      data:
                        id: 1
                        department_name: Computer Science and Engineering
                        department_shortname: CSE
                      message: Department "Computer Science and Engineering" created
                        successfully
          description: ''
        '400':
          description: Invalid data
        '403':
          description: Only superadmin can create departments
  /api/exam-questions/{exam_id}/:
    get:
      operationId: exam_questions_list
      description: Retrieve all questions that belong to a specific exam
      summary: Get all questions in an exam
      parameters:
      - in: path
        name: exam_id
        schema:
          type: integer
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Exam
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExamQuestionList'
          description: ''
  /api/exam-questions/{exam_id}/add/:
    post:
      operationId: exam_questions_add_create
      description: Add a single question to a specific exam. Validates that present_question
        count doesn't exceed total_questions limit.
      summary: Add individual question to exam
      parameters:
      - in: path
        name: exam_id
        schema:
          type: integer
        required: true
      tags:
      - Exam
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamQuestionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExamQuestionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamQuestionRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  question:
                    $ref: '#/components/schemas/ExamQuestion'
                  exam_stats:
                    type: object
                    properties:
                      present_question:
                        type: integer
                      total_questions:
                        type: integer
                      remaining_slots:
                        type: integer
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Bad request - validation errors or exam full
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Exam not found
          description: ''
  /api/exam-questions/{exam_id}/delete/:
    delete:
      operationId: exam_questions_delete_destroy
      description: Delete a specific exam and all its associated questions
      summary: Delete exam
      parameters:
      - in: path
        name: exam_id
        schema:
          type: integer
        required: true
      tags:
      - Exam
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  deleted_exam_id:
                    type: integer
                    description: ID of deleted exam
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Exam not found
          description: ''
  /api/exam-questions/{exam_id}/question/{question_id}/:
    get:
      operationId: exam_questions_question_retrieve
      description: Update or delete a specific question within an exam. Use PUT to
        update question details or DELETE to remove the question from the exam.
      summary: Edit or delete specific question in an exam
      parameters:
      - in: path
        name: exam_id
        schema:
          type: integer
        required: true
      - in: path
        name: question_id
        schema:
          type: integer
        required: true
      tags:
      - Exam
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  question:
                    $ref: '#/components/schemas/ExamQuestion'
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Question or exam not found
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Bad request - validation errors
          description: ''
    put:
      operationId: exam_questions_question_update
      description: Update or delete a specific question within an exam. Use PUT to
        update question details or DELETE to remove the question from the exam.
      summary: Edit or delete specific question in an exam
      parameters:
      - in: path
        name: exam_id
        schema:
          type: integer
        required: true
      - in: path
        name: question_id
        schema:
          type: integer
        required: true
      tags:
      - Exam
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamQuestionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExamQuestionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamQuestionRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  question:
                    $ref: '#/components/schemas/ExamQuestion'
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Question or exam not found
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Bad request - validation errors
          description: ''
    patch:
      operationId: exam_questions_question_partial_update
      description: Update or delete a specific question within an exam. Use PUT to
        update question details or DELETE to remove the question from the exam.
      summary: Edit or delete specific question in an exam
      parameters:
      - in: path
        name: exam_id
        schema:
          type: integer
        required: true
      - in: path
        name: question_id
        schema:
          type: integer
        required: true
      tags:
      - Exam
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExamQuestionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExamQuestionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedExamQuestionRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  question:
                    $ref: '#/components/schemas/ExamQuestion'
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Question or exam not found
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Bad request - validation errors
          description: ''
    delete:
      operationId: exam_questions_question_destroy
      description: Update or delete a specific question within an exam. Use PUT to
        update question details or DELETE to remove the question from the exam.
      summary: Edit or delete specific question in an exam
      parameters:
      - in: path
        name: exam_id
        schema:
          type: integer
        required: true
      - in: path
        name: question_id
        schema:
          type: integer
        required: true
      tags:
      - Exam
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    description: Success message
                  question:
                    $ref: '#/components/schemas/ExamQuestion'
          description: ''
        '404':
          content:
            application/json:
              schema:
                description: Question or exam not found
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Bad request - validation errors
          description: ''
  /api/exams/generate/:
    post:
      operationId: generate_exam
      description: Generate exam questions based on subjects and marks. Questions
        are not saved until explicitly requested.
      summary: Generate exam questions
      tags:
      - Exam Generation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamGenerationRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExamGenerationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamGenerationRequestRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedExamResponse'
          description: Exam questions generated successfully
        '400':
          description: Invalid request data
        '404':
          description: Not enough questions available
  /api/exams/save-generated/:
    post:
      operationId: save_generated_exam
      description: Save exam data and questions directly to database. Creates exam
        record and associated exam questions.
      summary: Save exam with questions
      tags:
      - Exam Generation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamSaveRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExamSaveRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamSaveRequestRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '201':
          description: Exam saved successfully
        '400':
          description: Invalid request data
  /api/get-all-results-by-teacher/{teacher_id}/:
    get:
      operationId: get_all_results_by_teacher
      description: Get paginated results summary for all students under a teacher.
        Superadmin sees all results, others see results based on teacher_id.
      summary: Get all exam results summary for a teacher
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Number of results per page
      - in: query
        name: semester
        schema:
          type: string
        description: Filter by semester
      - in: path
        name: teacher_id
        schema:
          type: integer
        required: true
      tags:
      - Exam Results
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultsSummary'
          description: Results summary retrieved successfully
        '404':
          description: Teacher not found
  /api/info/:
    get:
      operationId: get_api_info
      description: Get basic information about the AMS DIU Backend API
      summary: API Information
      tags:
      - Information
      security:
      - BearerAuth: []
      - cookieAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIInfoResponse'
          description: ''
  /api/menus/:
    get:
      operationId: menus_retrieve
      description: Retrieve all available menus in the system.
      summary: Get all menus
      tags:
      - Menus
      security:
      - BearerAuth: []
      - cookieAuth: []
      - BearerAuth: []
