components:
  schemas:
    APIInfoResponse:
      type: object
      description: Serializer for API information response
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        documentation:
          type: object
          additionalProperties: {}
        endpoints:
          type: object
          additionalProperties: {}
        features:
          type: array
          items:
            type: string
      required:
      - description
      - documentation
      - endpoints
      - features
      - name
      - version
    BlockQuestionRequestRequest:
      type: object
      description: Serializer for blocking a question
      properties:
        question_id:
          type: integer
        remarks:
          type: string
          minLength: 1
      required:
      - question_id
      - remarks
    BlocklistQuestion:
      type: object
      description: Serializer for BlocklistQuestion model
      properties:
        id:
          type: integer
          readOnly: true
        subject:
          type: string
          maxLength: 255
        questions:
          type: string
        type:
          $ref: '#/components/schemas/TypeBa3Enum'
        text:
          type: string
          nullable: true
        options:
          nullable: true
        answer:
          nullable: true
        marks:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        semester:
          type: string
        department_shortname:
          type: string
        original_question_id:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: ID of the original scrapped question
        remarks:
          type: string
          description: Reason for blocking this question
        creator:
          type: integer
        creator_username:
          type: string
          readOnly: true
        issue_solved:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - creator
      - creator_username
      - id
      - original_question_id
      - questions
      - remarks
      - semester
      - subject
      - type
      - updated_at
    CreateExamScheduleRequest:
      type: object
      description: |-
        Serializer for creating exam schedules
        Auto-calculates end_time based on exam duration
      properties:
        exam_id:
          type: integer
          minimum: 1
          description: ID of the exam to schedule (must exist in Exam table)
        start_time:
          type: string
          format: date-time
          description: Start time of the exam in ISO 8601 format (e.g., 2024-12-15T10:00:00Z)
        is_active:
          type: boolean
          default: true
          description: 'Whether the schedule is active (default: true)'
      required:
      - exam_id
      - start_time
    EnhancedExamResult:
      type: object
      description: Enhanced serializer for exam results with subject breakdown
      properties:
        student_id:
          type: integer
        exam_id:
          type: integer
        student_name:
          type: string
        exam_details:
          type: object
          additionalProperties: {}
        results:
          type: object
          additionalProperties: {}
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectResult'
      required:
      - exam_details
      - exam_id
      - results
      - student_id
      - student_name
      - subjects
    Exam:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        department:
          type: string
          maxLength: 255
        semester:
          type: string
          maxLength: 50
        total_questions:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Maximum allowed questions for this exam
        present_question:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Current number of questions in this exam
        total_marks:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        except_semesters:
          type: array
          items:
            type: string
            maxLength: 100
          description: List of semesters to exclude
        language:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        faculty:
          type: string
          nullable: true
          maxLength: 255
      required:
      - created_at
      - department
      - duration_minutes
      - id
      - semester
      - total_marks
      - total_questions
      - updated_at
    ExamCreateRequest:
      type: object
      properties:
        department:
          type: string
          minLength: 1
          maxLength: 255
        semester:
          type: string
          minLength: 1
          maxLength: 50
        total_questions:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Maximum allowed questions for this exam
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        subject_distribution:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
          description: Percentage distribution of subjects (sum must be 100)
        except_semesters:
          type: array
          items:
            type: string
            minLength: 1
          description: List of semesters to exclude
      required:
      - department
      - duration_minutes
      - semester
      - subject_distribution
      - total_questions
    ExamGenerationRequestRequest:
      type: object
      description: Serializer for exam generation request
      properties:
        department_id:
          type: integer
        semester:
          type: string
          minLength: 1
          maxLength: 50
        duration_minutes:
          type: integer
          minimum: 1
        language:
          type: string
          minLength: 1
          default: english
          maxLength: 50
        faculty:
          type: string
          minLength: 1
          maxLength: 255
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectMarksRequest'
        regenerate:
          type: boolean
          default: false
        exclude_questions:
          type: array
          items:
            type: integer
      required:
      - department_id
      - duration_minutes
      - faculty
      - semester
      - subjects
    ExamQuestion:
      type: object
      description: Serializer for ExamQuestion model - used for editing exam questions
      properties:
        id:
          type: integer
          readOnly: true
        exam:
          type: integer
          readOnly: true
        subject:
          type: string
          maxLength: 255
        question_text:
          type: string
        type:
          $ref: '#/components/schemas/TypeBa3Enum'
        text:
          type: string
          nullable: true
        options:
          nullable: true
        answer:
          type: string
          nullable: true
        marks:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
      required:
      - exam
      - id
      - question_text
      - subject
      - type
    ExamQuestionRequest:
      type: object
      description: Serializer for ExamQuestion model - used for editing exam questions
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 255
        question_text:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/TypeBa3Enum'
        text:
          type: string
          nullable: true
        options:
          nullable: true
        answer:
          type: string
          nullable: true
        marks:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
      required:
      - question_text
      - subject
      - type
    ExamQuestionSaveRequest:
      type: object
      description: Serializer for individual question data when saving exam
      properties:
        id:
          type: integer
          description: Optional original question ID
        subject:
          type: string
          minLength: 1
          maxLength: 255
        questions:
          type: string
          minLength: 1
          description: Question text
        type:
          $ref: '#/components/schemas/ExamQuestionSaveTypeEnum'
        text:
          type: string
          nullable: true
        options:
          nullable: true
        answer:
          nullable: true
          description: Can be string or array
        marks:
          type: integer
          minimum: 1
          default: 1
        semester:
          type: string
          minLength: 1
          description: Original semester info
          maxLength: 100
        department_shortname:
          type: string
          minLength: 1
          default: CSE
          maxLength: 50
      required:
      - questions
      - subject
      - type
    ExamQuestionSaveTypeEnum:
      enum:
      - mcq
      - option
      - short
      - long
      - tf
      - fill
      type: string
      description: |-
        * `mcq` - Multiple Choice
        * `option` - Multiple Choice Option
