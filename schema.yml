components:
  schemas:
    APIInfoResponse:
      type: object
      description: Serializer for API information response
      properties:
        name:
          type: string
        version:
          type: string
        description:
          type: string
        documentation:
          type: object
          additionalProperties: {}
        endpoints:
          type: object
          additionalProperties: {}
        features:
          type: array
          items:
            type: string
      required:
      - description
      - documentation
      - endpoints
      - features
      - name
      - version
    AdmissionResult:
      type: object
      description: Serializer for AdmissionResult model
      properties:
        id:
          type: integer
          readOnly: true
        exam:
          type: integer
          description: The exam this result belongs to
        student:
          type: integer
          description: The student this result belongs to
        student_username:
          type: string
          readOnly: true
        student_full_name:
          type: string
          readOnly: true
        student_f_id:
          type: string
          readOnly: true
        department:
          type: integer
          nullable: true
          description: Department the student applied for
        department_name:
          type: string
          readOnly: true
        department_shortname:
          type: string
          readOnly: true
        mcq_marks:
          type: number
          format: double
          minimum: 0.0
          description: Marks obtained in MCQ portion
        viva_marks:
          type: number
          format: double
          minimum: 0.0
          description: Marks obtained in viva portion
        total_marks:
          type: number
          format: double
          readOnly: true
          description: Total marks (MCQ + Viva)
        subject_wise_marks:
          description: Subject-wise breakdown of marks in JSON format
        is_selected:
          type: boolean
          description: True if total marks >= department threshold
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            Publication status of the result

            * `PENDING` - Pending
            * `PUBLISHED` - Published
            * `CANCELLED` - Cancelled
        threshold_applied:
          type: number
          format: double
          nullable: true
          description: The threshold that was applied during calculation
        remarks:
          type: string
          nullable: true
          description: Additional remarks or notes about the result
        exam_details:
          type: object
          additionalProperties: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - department_name
      - department_shortname
      - exam
      - exam_details
      - id
      - student
      - student_f_id
      - student_full_name
      - student_username
      - total_marks
      - updated_at
    BlockQuestionRequest:
      type: object
      description: Serializer for blocking a scrapped question
      properties:
        question_id:
          type: integer
          description: ID of the scrapped question to block
        remarks:
          type: string
          minLength: 1
          description: Reason for blocking this question
          maxLength: 1000
      required:
      - question_id
      - remarks
    BlockedQuestion:
      type: object
      description: Serializer for BlocklistQuestion model
      properties:
        id:
          type: integer
          readOnly: true
        subject:
          type: string
          maxLength: 255
        questions:
          type: string
        type:
          $ref: '#/components/schemas/TypeBa3Enum'
        text:
          type: string
          nullable: true
        options:
          nullable: true
        answer:
          nullable: true
        marks:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        semester:
          type: string
        department_shortname:
          type: string
        original_question_id:
          type: integer
          readOnly: true
          description: ID of the original scrapped question
        remarks:
          type: string
          description: Reason for blocking this question
        creator:
          type: integer
          readOnly: true
        creator_username:
          type: string
          readOnly: true
        issue_solved:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - creator
      - creator_username
      - id
      - original_question_id
      - questions
      - remarks
      - semester
      - subject
      - type
      - updated_at
    BulkThresholdMappingRequest:
      type: object
      description: Serializer for bulk creating/updating threshold mappings
      properties:
        exam_id:
          type: integer
          description: Exam ID for which thresholds are being set
        mappings:
          type: array
          items:
            $ref: '#/components/schemas/ThresholdMappingItemRequest'
          description: List of department-threshold mappings
      required:
      - exam_id
      - mappings
    CalculateAdmissionResultsRequest:
      type: object
      description: Serializer for triggering admission results calculation
      properties:
        exam_id:
          type: integer
          description: Exam ID for which to calculate admission results
      required:
      - exam_id
    CalculateResultsResponse:
      type: object
      description: Response serializer for calculate results operation
      properties:
        success:
          type: boolean
        message:
          type: string
        processed_count:
          type: integer
        selected_count:
          type: integer
        not_selected_count:
          type: integer
        exam_id:
          type: integer
      required:
      - exam_id
      - message
      - not_selected_count
      - processed_count
      - selected_count
      - success
    CreateExamScheduleRequest:
      type: object
      description: |-
        Serializer for creating exam schedules
        Auto-calculates end_time based on exam duration
      properties:
        exam_id:
          type: integer
          minimum: 1
          description: ID of the exam to schedule (must exist in Exam table)
        start_time:
          type: string
          format: date-time
          description: Start time of the exam in ISO 8601 format (e.g., 2024-12-15T10:00:00Z)
        is_active:
          type: boolean
          default: true
          description: 'Whether the schedule is active (default: true)'
      required:
      - exam_id
      - start_time
    DepartmentThreshold:
      type: object
      description: Serializer for DepartmentThreshold model
      properties:
        id:
          type: integer
          readOnly: true
        exam:
          type: integer
          description: The exam for which this threshold applies
        department:
          type: integer
          description: The department this threshold applies to
        department_name:
          type: string
          readOnly: true
        department_shortname:
          type: string
          readOnly: true
        min_threshold_mark:
          type: number
          format: double
          minimum: 0.0
          description: Minimum marks required for admission to this department
        exam_details:
          type: object
          additionalProperties: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - department
      - department_name
      - department_shortname
      - exam
      - exam_details
      - id
      - min_threshold_mark
      - updated_at
    EnhancedExamResult:
      type: object
      description: Enhanced serializer for exam results with subject breakdown
      properties:
        student_id:
          type: integer
        exam_id:
          type: integer
        student_name:
          type: string
        exam_details:
          type: object
          additionalProperties: {}
        results:
          type: object
          additionalProperties: {}
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/SubjectResult'
      required:
      - exam_details
      - exam_id
      - results
      - student_id
      - student_name
      - subjects
    Exam:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        department:
          type: string
          maxLength: 255
        semester:
          type: string
          maxLength: 50
        total_questions:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Maximum allowed questions for this exam
        present_question:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Current number of questions in this exam
        total_marks:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        duration_minutes:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        except_semesters:
          type: array
          items:
            type: string
            maxLength: 100
          description: List of semesters to exclude
        language:
          type: string
          maxLength: 50
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        faculty:
          type: string
          nullable: true
          maxLength: 255
      required:
      - created_at
      - department
      - duration_minutes
      - id
      - semester
      - total_marks
      - total_questions
      - updated_at
    ExamCreateRequest:
      type: object
      properties:
        department:
          type: string
          minLength: 1
          maxLength: 255
        semester:
          type: string
          minLength: 1
          maxLength: 50
        total_questions:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: Maximum allowed questions for this exam
