openapi: 3.0.3
info:
  title: AMS DIU Backend API
  version: 1.0.0
  description: API for Academic Management System - DIU Backend with scrapped questions
    and educational content
paths:
  /api/add-viva-marks/{student_id}/:
    post:
      operationId: add_viva_marks
      description: Add new viva marks or update existing viva marks for a specific
        student
      summary: Add or update viva marks for a student
      parameters:
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - Viva Marks Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VivaMarksCreateUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VivaMarksCreateUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VivaMarksCreateUpdateRequest'
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VivaMarks'
          description: Viva marks updated successfully
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VivaMarks'
          description: Viva marks created successfully
        '400':
          description: Invalid request data
        '404':
          description: Student not found
  /api/admission/calculate-results/:
    post:
      operationId: calculate_admission_results
      description: Triggers calculation of admission results for all students who
        took the specified exam. This will compute MCQ + Viva marks and determine
        selection status based on department thresholds.
      summary: Calculate admission results for an exam
      tags:
      - Admission Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateAdmissionResultsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CalculateAdmissionResultsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CalculateAdmissionResultsRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculateResultsResponse'
          description: Results calculated successfully
        '400':
          description: Invalid request data or missing thresholds
        '404':
          description: Exam not found
  /api/admission/get-threshold-mapping/:
    get:
      operationId: get_threshold_mapping
      description: Retrieve department threshold mappings for a specific exam or all
        exams
      summary: Get department threshold mappings
      parameters:
      - in: query
        name: department_id
        schema:
          type: integer
        description: Filter by department ID
      - in: query
        name: exam_id
        schema:
          type: integer
        description: Filter by exam ID
      tags:
      - Admission Management
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DepartmentThreshold'
          description: Threshold mappings retrieved successfully
  /api/admission/publish-results/:
    post:
      operationId: publish_admission_results
      description: Change status of admission results to PUBLISHED for a specific
        exam
      summary: Publish admission results
      tags:
      - Admission Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CalculateAdmissionResultsRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CalculateAdmissionResultsRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CalculateAdmissionResultsRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Results published successfully
        '404':
          description: Exam not found or no results to publish
  /api/admission/recalculate/{exam_id}/{student_id}/:
    post:
      operationId: recalculate_student_result
      description: Recalculate admission result for a specific student in a specific
        exam
      summary: Recalculate result for a single student
      parameters:
      - in: path
        name: exam_id
        schema:
          type: integer
        required: true
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - Admission Management
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionResult'
          description: Student result recalculated successfully
        '400':
          description: Calculation failed
        '404':
          description: Student or exam not found
  /api/admission/results/:
    get:
      operationId: get_admission_results
      description: Retrieve paginated list of admission results with optional filtering
      summary: Get admission results
      parameters:
      - in: query
        name: department_id
        schema:
          type: integer
        description: Filter by department ID
      - in: query
        name: exam_id
        schema:
          type: integer
        description: Filter by exam ID
      - in: query
        name: is_selected
        schema:
          type: boolean
        description: Filter by selection status (true/false)
      - in: query
        name: page
        schema:
          type: integer
        description: Page number
      - in: query
        name: page_size
        schema:
          type: integer
        description: Number of results per page (max 100)
      - in: query
        name: status
        schema:
          type: string
        description: Filter by publication status (PENDING/PUBLISHED/CANCELLED)
      - in: query
        name: student_id
        schema:
          type: integer
        description: Filter by student ID
      tags:
      - Admission Management
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdmissionResult'
          description: Admission results retrieved successfully
  /api/admission/results/{result_id}/:
    get:
      operationId: get_admission_result_by_id
      description: Retrieve a specific admission result by its ID
      summary: Get specific admission result by ID
      parameters:
      - in: path
        name: result_id
        schema:
          type: integer
        required: true
      tags:
      - Admission Management
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionResult'
          description: Admission result retrieved successfully
        '404':
          description: Admission result not found
  /api/admission/results/student/{exam_id}/{student_id}/:
    get:
      operationId: get_student_admission_result
      description: Retrieve the admission result for a specific student in a specific
        exam
      summary: Get admission result for a specific student in an exam
      parameters:
      - in: path
        name: exam_id
        schema:
          type: integer
        required: true
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - Admission Management
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdmissionResult'
          description: Student admission result retrieved successfully
        '404':
          description: Result not found
  /api/admission/threshold-mapping/:
    post:
      operationId: set_threshold_mapping
      description: Bulk create or update department threshold mappings for a specific
        exam. This sets the minimum marks required for admission to each department.
      summary: Set department threshold mappings for an exam
      tags:
      - Admission Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkThresholdMappingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BulkThresholdMappingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BulkThresholdMappingRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdMappingResponse'
          description: Threshold mappings updated successfully
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdMappingResponse'
          description: Threshold mappings created successfully
        '400':
          description: Invalid request data
        '404':
          description: Exam or department not found
  /api/admission/threshold/{threshold_id}/:
    get:
      operationId: get_threshold_by_id
      description: Retrieve a specific department threshold mapping by its ID
      summary: Get specific threshold mapping by ID
      parameters:
      - in: path
        name: threshold_id
        schema:
          type: integer
        required: true
      tags:
      - Admission Management
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartmentThreshold'
          description: Threshold mapping retrieved successfully
        '404':
          description: Threshold mapping not found
  /api/admission/threshold/{threshold_id}/delete/:
    delete:
      operationId: delete_threshold_mapping
      description: Delete a specific department threshold mapping by ID
      summary: Delete threshold mapping
      parameters:
      - in: path
        name: threshold_id
        schema:
          type: integer
        required: true
      tags:
      - Admission Management
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Threshold mapping deleted successfully
        '404':
          description: Threshold mapping not found
  /api/all-exams/:
    get:
      operationId: all_exams_list
      description: 'Retrieve exams with role-based filtering: superadmin sees all
        exams, other users only see exams that contain questions matching their department_shortname.'
      summary: Get all exams
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Exam
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExamList'
          description: ''
  /api/all-marks-distribution/:
    get:
      operationId: get_all_marks_distribution
      description: Retrieve all marks distribution with optional filtering by department
      summary: Get all marks distribution
      parameters:
      - in: query
        name: department_id
        schema:
          type: integer
        description: Filter by department ID
      - in: query
        name: department_name
        schema:
          type: string
        description: Filter by department name
      tags:
      - Marks Distribution Management
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MarksDistribution'
          description: Marks distribution retrieved successfully
  /api/all-rubrics/:
    get:
      operationId: get_all_viva_rubrics
      description: Retrieve all viva rubrics with optional filtering by department
      summary: Get all viva rubrics
      parameters:
      - in: query
        name: department_id
        schema:
          type: integer
        description: Filter by department ID
      - in: query
        name: department_name
        schema:
          type: string
        description: Filter by department name
      tags:
      - Viva Rubrics Management
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VivaRubrics'
          description: Viva rubrics retrieved successfully
  /api/all-scrapped-questions/:
    get:
      operationId: all_scrapped_questions_list
      description: Retrieve all scrapped questions with optional filtering, sorting,
        and pagination. Returns questions with pagination metadata.
      summary: Get all scrapped questions
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: Page number (default 1)
      - in: query
        name: per_page
        schema:
          type: integer
        description: Items per page (default 10, max 100)
      - in: query
        name: search
        schema:
          type: string
        description: Search in question text and subject
      - in: query
        name: semester
        schema:
          type: string
        description: Filter questions by semester
      - in: query
        name: sort_by
        schema:
          type: string
          enum:
          - -id
          - -marks
          - -semester
          - -subject
          - -type
          - id
          - marks
          - semester
          - subject
          - type
        description: Sort questions by field
      - in: query
        name: subject
        schema:
          type: string
        description: Filter questions by subject
      - in: query
        name: type
        schema:
          type: string
          enum:
          - option
          - text
        description: Filter questions by type
      tags:
      - Questions
      security:
      - BearerAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedScrappedQuestionList'
          description: ''
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Authenticate user and return simple token with user details
      summary: User Login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username for login
                  example: admin
                password:
                  type: string
                  description: Password for login
                  example: admin123
              required:
              - username
              - password
            examples:
              LoginRequest:
                value:
                  username: admin
                  password: admin123
                summary: Example login request
                description: Login with username and password
      security:
      - BearerAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Login successful
                content:
                  application/json:
                    example:
                      success: true
                      message: Login successful
                      data:
                        token: abc123def456ghi789...
                        user:
                          id: 1
                          username: admin
                          email: admin@example.com
                          created_at: '2024-01-01T10:00:00Z'
                          role_details:
                            id: 1
                            role_name: superadmin
                          department_details:
                            id: 1
                            department_name: Computer Science
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid credentials or validation error
                content:
                  application/json:
                    example:
                      success: false
                      message: Invalid credentials
                      errors:
                      - Invalid credentials
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Refresh access token using refresh token
      summary: Refresh Token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh:
                  type: string
                  description: Refresh token
                  example: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
              required:
              - refresh
            examples:
              RefreshTokenRequest:
                value:
                  refresh: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
                summary: Example refresh token request
                description: Refresh access token using refresh token
      security:
      - BearerAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Token refreshed successfully
                content:
                  application/json:
                    example:
                      access: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9...
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid refresh token
                content:
                  application/json:
                    example:
                      detail: Token is blacklisted
                      code: token_not_valid
          description: ''
  /api/auth/verify/:
    post:
      operationId: auth_verify_create
      description: Verify token and return user details
      summary: Verify Token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: Authentication token
                  example: abc123def456ghi789...
              required:
              - token
            examples:
              VerifyTokenRequest:
                value:
                  token: abc123def456ghi789...
                summary: Example token verification request
                description: Verify authentication token
      security:
      - BearerAuth: []
      - BearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Token is valid
                content:
                  application/json:
                    example:
                      success: true
                      message: Token is valid
                      data:
                        user:
                          id: 1
                          username: admin
                          email: admin@example.com
                          created_at: '2024-01-01T10:00:00Z'
                          role_details:
                            id: 1
                            role_name: superadmin
                          department_details:
                            id: 1
                            department_name: Computer Science
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Invalid token
                content:
                  application/json:
                    example:
                      success: false
                      message: Invalid token
                      errors:
                      - Token is invalid or expired
          description: ''
  /api/blocked-question/{question_id}/delete/:
    delete:
      operationId: delete_blocked_question
      description: Permanently delete a blocked question from the blocklist. This
        action cannot be undone.
      summary: Permanently delete a blocked question
      parameters:
      - in: path
        name: question_id
        schema:
          type: integer
        required: true
      tags:
      - Question Management
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Blocked question deleted successfully
        '404':
          description: Blocked question not found
  /api/blocked-question/{question_id}/restore/:
    put:
      operationId: restore_blocked_question
      description: Update a blocked question with new data and restore it back to
        scrapped_questions. The question will be deleted from blocklist_questions
        and added back to scrapped_questions.
      summary: Update and restore a blocked question
      parameters:
      - in: path
        name: question_id
        schema:
          type: integer
        required: true
      tags:
      - Question Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreQuestionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RestoreQuestionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RestoreQuestionRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Question restored successfully
        '400':
          description: Invalid request data
        '404':
          description: Blocked question not found
  /api/create-exam/:
    post:
      operationId: create_exam_create
      description: Create an exam by selecting questions from different subjects based
        on percentage distribution.
      summary: Create exam with questions
      tags:
      - Exam
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExamCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExamCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExamCreateRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  exam_id:
                    type: integer
                    description: Created exam ID
                  total_questions:
                    type: integer
                    description: Total questions in exam
                  total_marks:
                    type: integer
                    description: Total marks for exam
                  message:
                    type: string
                    description: Success message
          description: ''
        '400':
          content:
            application/json:
              schema:
                description: Bad request - validation errors
          description: ''
  /api/create-marks-distribution/:
    post:
      operationId: create_marks_distribution
      description: Create new marks distribution for a department with SSC, HSC, and
        Diploma marks
      summary: Create new marks distribution
      tags:
      - Marks Distribution Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarksDistributionCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/MarksDistributionCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MarksDistributionCreateRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarksDistribution'
          description: Marks distribution created successfully
        '400':
          description: Invalid request data
        '404':
          description: Department not found
  /api/create-rubrics/:
    post:
      operationId: create_viva_rubrics
      description: Create new viva rubrics for a department with marking criteria
      summary: Create new viva rubrics
      tags:
      - Viva Rubrics Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VivaRubricsCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VivaRubricsCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VivaRubricsCreateRequest'
        required: true
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VivaRubrics'
          description: Viva rubrics created successfully
        '400':
          description: Invalid request data
        '404':
          description: Department not found
  /api/delete-viva-marks/{student_id}/:
    delete:
      operationId: delete_viva_marks
      description: Delete viva marks record for a specific student
      summary: Delete viva marks for a student
      parameters:
      - in: path
        name: student_id
        schema:
          type: integer
        required: true
      tags:
      - Viva Marks Management
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Viva marks deleted successfully
        '404':
          description: Student or viva marks not found
  /api/departments/:
    get:
      operationId: get_all_departments
      description: Retrieve all departments in the system with their names and shortnames.
      summary: Get all departments
      tags:
      - Departments
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Departments retrieved successfully
                content:
                  application/json:
                    example:
                      success: true
                      data:
                      - id: 1
                        department_name: Computer Science and Engineering
                        department_shortname: CSE
                      - id: 2
                        department_name: Electrical and Electronic Engineering
                        department_shortname: EEE
                      message: Departments retrieved successfully
          description: ''
  /api/departments/{department_id}/:
    get:
      operationId: get_department_by_id
      description: Retrieve a specific department by its ID with name and shortname.
      summary: Get department by ID
      parameters:
      - in: path
        name: department_id
        schema:
          type: integer
        required: true
      tags:
      - Departments
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Department retrieved successfully
                content:
                  application/json:
                    example:
                      success: true
                      data:
                        id: 1
                        department_name: Computer Science and Engineering
                        department_shortname: CSE
                      message: Department retrieved successfully
          description: ''
        '404':
          description: Department not found
  /api/departments/{department_id}/delete/:
    delete:
      operationId: delete_department
      description: 'Delete a department. Only superadmin can perform this action.
        Warning: This will affect all users assigned to this department.'
      summary: Delete department
      parameters:
      - in: path
        name: department_id
        schema:
          type: integer
        required: true
      tags:
      - Departments
      security:
      - BearerAuth: []
      - BearerAuth: []
      responses:
        '200':
          description: Department deleted successfully
        '403':
          description: Only superadmin can delete departments
        '404':
          description: Department not found
  /api/departments/{department_id}/update/:
    put:
      operationId: update_department_full
      description: Update department name and shortname. Only superadmin can perform
        this action. Requires all fields.
      summary: Update department (PUT)
      parameters:
      - in: path
        name: department_id
        schema:
          type: integer
        required: true
